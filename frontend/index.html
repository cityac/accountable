<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Accountable</title>
    <script>
      // Before the first paint, so a dark choice never flashes light. The key matches src/lib/mode.ts.
      try {
        if (localStorage.getItem("accountable-mode") === "dark")
          document.documentElement.setAttribute("data-mode", "dark");
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
