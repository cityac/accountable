name: CI

on:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so gitleaks also finds a secret that was committed and later removed.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks

      - name: Scan for secrets
        # This branch's history only: checkout fetches every branch, and another may be an experiment.
        run: gitleaks git --redact --verbose --log-opts=HEAD .

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: astral-sh/setup-uv@v10.4.0
        with:
          version: latest

      # Every check except the end-to-end tests, which run locally with npm run check.
      - name: Run the quick checks
        run: npm run check:quick
